# ─────────────────────────────────────────────────────────────────────────────
#  Nginx configuration for the React/Vite frontend container.
#
#  Responsibilities:
#    • Serve the built React SPA at /
#    • Enable gzip compression for text/JS/CSS/JSON
#    • Cache-bust HTML (no-store) but cache JS/CSS/images aggressively
#    • Handle client-side routing (React Router): fall back to index.html
#    • Security headers (X-Frame-Options, CSP, etc.)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── Static assets — aggressive caching ───────────────────────────────────
    # Vite outputs hashed filenames, so these are safe to cache forever.
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── HTML — never cache (SPA entry point) ─────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── React Router — catch-all falls back to index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health probe ─────────────────────────────────────────────────────────
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;
}
