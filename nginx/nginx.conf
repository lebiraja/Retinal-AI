# ─────────────────────────────────────────────────────────────────────────────
#  Nginx Reverse Proxy Configuration
#
#  Architecture:
#    Internet → nginx:80 → frontend:80   (static React app)
#                        → backend:8000  (API, /api/* routes)
#
#  Path routing:
#    /api/*      → stripped prefix → backend service
#    /docs       → backend Swagger UI (passthrough, no strip)
#    /redoc      → backend ReDoc UI
#    /*          → frontend service (React SPA)
#
#  Upstream DNS uses Docker Compose service names.
#  resolver 127.0.0.11 — Docker's internal DNS server.
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=batch_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Docker internal DNS — required for runtime upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Security ──────────────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Upload size limit (matches backend MAX_FILE_SIZE_MB cap) ─────────────
    client_max_body_size 50M;

    # ── Timeouts (generous for GPU inference) ─────────────────────────────────
    proxy_connect_timeout    10s;
    proxy_send_timeout      120s;
    proxy_read_timeout      120s;
    send_timeout            120s;

    # ── Shared proxy headers ──────────────────────────────────────────────────
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_http_version                  1.1;
    proxy_set_header Connection         "";

    # ── /api/predict-batch — stricter rate limit ──────────────────────────────
    location ~ ^/api/predict-batch {
        limit_req zone=batch_limit burst=3 nodelay;

        set $backend_url "http://backend:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;

        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # ── /api/* → backend (strip /api prefix) ─────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;

        set $backend_url "http://backend:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;

        # Pass large multipart uploads through without buffering to disk
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # ── Swagger / ReDoc — direct passthrough ─────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json) {
        set $backend_url "http://backend:8000";
        proxy_pass $backend_url;
    }

    # ── Nginx proxy own health check ──────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Everything else → frontend SPA ───────────────────────────────────────
    location / {
        set $frontend_url "http://frontend:80";
        proxy_pass $frontend_url;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

